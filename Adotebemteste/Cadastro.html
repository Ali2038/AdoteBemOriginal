<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Adote um Amigo</title>
    <link rel="stylesheet" href="styles/Cadastro.css">
    <link rel="stylesheet" href="fonteLetras/fonte.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="img/dogo-argentino.png" alt="Logo da Adote um Amigo">
        </div>
        <nav>
            <ul>
                <li><a href="#inicio">Início</a></li>
                <li><a href="#sobre">Sobre</a></li>
                <li><button class="btn"><i class="fas fa-sign-in-alt"></i> Entrar</button></li>
                <li><button class="btn"><i class="fas fa-user-plus"></i> Cadastre-se</button></li>
            </ul>
        </nav>
    </header>

    <section id="cadastro">
        <div class="toggle-buttons">
            <button class="btn11" onclick="mostrarFormulario('adotante')">Cadastro Adotante</button>
            <button class="btn11" onclick="mostrarFormulario('tutor')">Cadastro Tutor</button>
        </div>
        
        <div id="form-adotante" class="formulario" style="display: block;">
            <h2>Cadastro Adotante</h2>
            <form id="form-adotante-back">
                <input type="text" placeholder="Nome" id="nome" required>
                <input type="text" placeholder="CPF" id="cpf" required>
                <label for="data_nascimento">Data de Nascimento</label>
                <input type="date" placeholder="Data de Nascimento" id="data_nascimento" required>
                <input type="tel" placeholder="Telefone" id="telefone" required>
                <input type="email" placeholder="Email" id="email" required>
                <input type="text" placeholder="CEP" id="cep" required>
                <input type="text" placeholder="Cidade"id="cidade" required>
                <input type="text" placeholder="Bairro" id="bairro" required>
                <input type="text" placeholder="Número" id="numero" required>
                <input type="text" placeholder="Complemento"id="complemento">
                <input type="password" placeholder="Senha" id="senha" required>
                <input type="password" placeholder="Confirmar Senha" required>
                <button type="submit" class="btn11">Cadastrar</button>
            </form>
        </div>
        
        <div id="form-tutor" class="formulario" style="display: none;">
            <h2>Cadastro Tutor</h2>
            <form>
                <input type="text" placeholder="Nome" id="nome" required>
                <input type="text" placeholder="CPF" id="cpf" required>
                <label for="nascimento">Data de Nascimento</label>
                <input type="date" placeholder="Data de Nascimento" id="nascimento" required>
                <input type="tel" placeholder="Telefone" id="telefone" required>
                <input type="email" placeholder="Email" id="email" required>
                <input type="text" placeholder="CEP" id="cep" required>
                <input type="text" placeholder="Cidade"id="cidade" required>
                <input type="text" placeholder="Bairro" id="bairro" required>
                <input type="text" placeholder="Número" id="numero" required>
                <input type="text" placeholder="Complemento"id="complemento">
                <input type="password" placeholder="Senha" id="senha" required>
                <input type="password" placeholder="Confirmar Senha" required>
                
                <h3>Cadastro do Animal</h3>
                <input type="text" placeholder="Raça" required>
                <input type="text" placeholder="Cor" required>
                <input type="text" placeholder="Espécie" required>
                <input type="text" placeholder="Situação de Saúde" required>
                <input type="text" placeholder="Idade" required>
                <input type="text" placeholder="Porte" required>
                <input type="text" placeholder="Sexo" required>
                <label>Imagem do Animal:</label>
                <input type="file" required>
                <label>Seu animal é vacinado?</label>
                <select required>
                    <option value="sim">Sim</option>
                    <option value="nao">Não</option>
                </select>
                <input type="text" placeholder="Se sim, quais?">
                <button type="submit" class="btn11">Cadastrar</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2023 Adote um Amigo. Todos os direitos reservados.</p>
        <p><a href="#">Política de Privacidade</a> | <a href="#">Termos de Uso</a></p>
    </footer>

    <!-- Modal de Sucesso -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="successModalLabel">Sucesso!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="green" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                    </svg>
                    <p class="mt-3">Cadastro realizado com sucesso!</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/Cadastro.js"></script>

    <script>
        document.getElementById('form-adotante-back').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nome = document.getElementById('nome').value;
            const cpf = document.getElementById('cpf').value;
            const nascimento = document.getElementById('data_nascimento').value;
            const telefone = document.getElementById('telefone').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const cep = document.getElementById('cep').value;
            const cidade = document.getElementById('cidade').value;
            const bairro = document.getElementById('bairro').value;
            const numero = document.getElementById('numero').value;
            const complemento = document.getElementById('complemento').value;

            try {
                // Primeiro, cadastrar o endereço
                const resEndereco = await fetch('http://localhost:3000/endereco', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cep, cidade, bairro, numero, complemento })
                });

                const enderecoData = await resEndereco.json();

                if (!resEndereco.ok) {
                    throw new Error('Erro ao cadastrar endereço: ' + enderecoData.message);
                }

                // Agora, cadastrar o usuário com o ID do endereço recebido
                const resUsuario = await fetch('http://localhost:3000/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, cpf, nascimento, telefone, email, senha, cep, cidade, bairro, numero, complemento })
                });

                const usuarioData = await resUsuario.json();

                if (!resUsuario.ok) {
                    throw new Error('Erro ao cadastrar usuário: ' + usuarioData.message);
                }

                // Exibir o modal de sucesso
                const successModal = new bootstrap.Modal(document.getElementById('successModal'));
                successModal.show();

                // Redirecionar após 2 segundos
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);

            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        });
    </script>
</body>
</html>
