<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Adote um Amigo - Minha Conta</title>
    <link rel="stylesheet" href="styles/minhaConta.css">
    <link rel="stylesheet" href="fonteLetras/fonte.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="img/dogo-argentino.png" alt="Logo da Adote um Amigo">
        </div>
        <nav>
            <ul>
                <li><a href="indexUsuario.html">Início</a></li>
                <li><a href="sobrenosUsuario.html">Sobre</a></li>
                <li>
                    <img src="img/user.png" alt="Usuário" class="user-icon rounded-circle" width="40" height="40">
                    <div id="userDropdown" class="user-modal">
                        <ul>
                            <li><a href="#" id="minhaConta">Minha Conta</a></li>
                            <li><a href="index.html">Sair</a></li>
                        </ul>
                    </div>
                </li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section id="dadosUsuario">
            <h1>Minha Conta</h1>
            <form id="userForm">
                <div class="input-group" id="userFields"></div>
                <button type="button" id="saveChanges" style="display:none;">Salvar Alterações</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2023 Adote um Amigo. Todos os direitos reservados.</p>
        <p><a href="#">Política de Privacidade</a> | <a href="#">Termos de Uso</a></p>
    </footer>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Pega o email do usuário do sessionStorage
            const emailUsuario = sessionStorage.getItem('email_usuario');
            
            if (!emailUsuario) {
                alert("Usuário não autenticado!");
                return;
            }

            const userFields = [
                { id: "userName", label: "Nome", type: "text" },
                { id: "userCPF", label: "CPF", type: "text" },
                { id: "userBirthdate", label: "Data de Nascimento", type: "date" },
                { id: "userPhone", label: "Telefone", type: "text" },
                { id: "userEmail", label: "Email", type: "email" },
                { id: "userCEP", label: "CEP", type: "text" },
                { id: "userCity", label: "Cidade", type: "text" },
                { id: "userNeighborhood", label: "Bairro", type: "text" },
                { id: "userNumber", label: "Número", type: "text" },
                { id: "userComplement", label: "Complemento", type: "text" },
                { id: "userPassword", label: "Senha", type: "password" },
                { id: "userConfirmPassword", label: "Confirmar Senha", type: "password" }
            ];
            
            const userFieldsContainer = document.getElementById("userFields");
            userFields.forEach(field => {
                const div = document.createElement("div");
                div.classList.add("input-group");
                div.innerHTML = `
                    <label for="${field.id}">${field.label}:</label>
                    <input type="${field.type}" id="${field.id}" name="${field.id}" value="" readonly>
                    <i class="fas fa-pencil-alt edit-icon" data-target="${field.id}"></i>
                `;
                userFieldsContainer.appendChild(div);
            });
            
        });
    </script>
</body>
</html>
