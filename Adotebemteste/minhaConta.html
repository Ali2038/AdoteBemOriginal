<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Adote um Amigo - Minha Conta</title>
    <link rel="stylesheet" href="styles/minhaConta.css">
    <link rel="stylesheet" href="fonteLetras/fonte.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="img/dogo-argentino.png" alt="Logo da Adote um Amigo">
        </div>
        <nav>
            <ul>
                <li><a href="indexUsuario.html">Início</a></li>
                <li><a href="sobrenosUsuario.html">Sobre</a></li>
               

                
             
                    <img src="img/user.png" alt="Usuário" class="user-icon rounded-circle" width="40" height="40">
                    <div id="userDropdown" class="user-modal">
                        <ul>
                            <li><a href="#" id="minhaConta">Minha Conta</a></li>
                            <li><a href="index.html">Sair</a></li>
                        </ul>
                    </div>
               
            </ul>
        </nav>
    </header>
    
    <main class="container mt-5">
        <section id="dadosUsuario">
            <h1 class="text-center mb-4">Minha Conta</h1>
            <form id="userForm" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nome:</label>
                    <input type="text" id="userName" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">CPF:</label>
                    <input type="text" id="userCPF" class="form-control" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Data de Nascimento:</label>
                    <input type="date" id="userBirthdate" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Telefone:</label>
                    <input type="text" id="userPhone" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email:</label>
                    <input type="email" id="userEmail" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">CEP:</label>
                    <input type="text" id="userCEP" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Cidade:</label>
                    <input type="text" id="userCity" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Bairro:</label>
                    <input type="text" id="userNeighborhood" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Número:</label>
                    <input type="text" id="userNumber" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Complemento:</label>
                    <input type="text" id="userComplement" class="form-control">
                </div>
                <div class="col-12 text-center">
                    <button type="button" id="saveChanges" class="btn btn-primary mt-3" style="display:none;">Salvar Alterações</button>
                </div>
            </form>
        </section>
    </main>


<footer>
        <p>&copy; 2023 Adote um Amigo. Todos os direitos reservados.</p>
        <p><a href="#">Política de Privacidade</a> | <a href="#">Termos de Uso</a></p>
    </footer>





    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Pega o email do usuário do sessionStorage
            const emailUsuario = sessionStorage.getItem('email_usuario');
            console.log("Email recuperado do sessionStorage:", emailUsuario);

            if (!emailUsuario) {
                alert("Usuário não autenticado!");
                return;
            }

            // Faz a requisição para buscar os dados do usuário com o email
            fetch(`http://localhost:3000/usuarios/email?email=${emailUsuario}`)
                .then(response => response.json())
                .then(data => {
                    console.log("Dados recebidos:", data); // Log para depuração

                    if (data.message) {
                        alert(data.message);
                        return;
                    }

                    // Preenche os campos do formulário com os dados do usuário
                    document.getElementById("userName").value = data.nome;
                    document.getElementById("userCPF").value = data.cpf;
                    document.getElementById("userBirthdate").value = data.nascimento.split("T")[0]; // Ajuste de formato
                    document.getElementById("userPhone").value = data.telefone;
                    document.getElementById("userEmail").value = data.email;
                    document.getElementById("userCEP").value = data.endereco.cep;
                    document.getElementById("userCity").value = data.endereco.cidade;
                    document.getElementById("userNeighborhood").value = data.endereco.bairro;
                    document.getElementById("userNumber").value = data.endereco.numero;
                    document.getElementById("userComplement").value = data.endereco.complemento;

                    // Exibir o botão "Salvar Alterações"
                    document.getElementById("saveChanges").style.display = 'block';
                })
                .catch(error => {
                    console.error('Erro ao carregar os dados do usuário:', error);
                    alert("Erro ao carregar os dados do usuário.");
                });

            // Salvar alterações
            document.getElementById("saveChanges").addEventListener("click", function() {
                const userData = {
                    nome: document.getElementById("userName").value,
                    cpf: document.getElementById("userCPF").value,
                    nascimento: document.getElementById("userBirthdate").value,
                    telefone: document.getElementById("userPhone").value,
                    email: document.getElementById("userEmail").value,
                    cep: document.getElementById("userCEP").value,
                    cidade: document.getElementById("userCity").value,
                    bairro: document.getElementById("userNeighborhood").value,
                    numero: document.getElementById("userNumber").value,
                    complemento: document.getElementById("userComplement").value
                };

                // Fazer requisição PUT para atualizar os dados do usuário no backend
                fetch(`http://localhost:3000/usuarios/email?email=${emailUsuario}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                })
                .then(response => response.json())
                .then(result => {
                    alert("Alterações salvas com sucesso!");
                })
                .catch(error => {
                    console.error('Erro ao salvar as alterações:', error);
                    alert("Erro ao salvar as alterações.");
                });
            });
        });
    </script>





<script>
    document.addEventListener("DOMContentLoaded", function() {
        var userIcon = document.querySelector(".user-icon");
        var userDropdown = document.getElementById("userDropdown");

        // Exibir/Ocultar o modal ao clicar na imagem do usuário
        userIcon.addEventListener("click", function(event) {
            event.stopPropagation(); // Impede que o clique feche imediatamente o modal
            userDropdown.style.display = userDropdown.style.display === "block" ? "none" : "block";
        });

        // Fechar o modal ao clicar fora dele
        document.addEventListener("click", function(event) {
            if (!userDropdown.contains(event.target) && event.target !== userIcon) {
                userDropdown.style.display = "none";
            }
        });
    });
</script>

  





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
