<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Adote um Amigo</title>
    <link rel="stylesheet" href="styles/Login.css">
    <link rel="stylesheet" href="fonteLetras/fonte.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="img/dogo-argentino.png" alt="Logo da Adote um Amigo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="sobrenos.html">Sobre</a></li>
                <li> <button class="btn"    onclick="window.location.href='Login.html'"   ><i class="fas fa-sign-in-alt"></i> Entrar</button></li>
                <li><button class="btn"  onclick="window.location.href='Cadastro.html'"  ><i class="fas fa-user-plus"></i> Cadastre-se</button></li>
            </ul>

        </nav>
    </header>

    <!-- Container Principal do Login -->
    <div class="login-wrapper">
        <!-- Container de Login -->
        <div class="login-container">
            <h2>Login</h2>
            <form action="#" method="POST" id="form-login">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
                <button type="submit" class="btn-login">Entrar</button>

            </form>
            <a href="#" class="forgot-password">Esqueci minha senha</a>
        </div>

        <!-- Linha Divisória -->
        <div class="separator"></div>

        <!-- Imagem ao lado -->
        <div class="login-image">
            <img src="img/labradoregato.jpg" alt="Cachorro e Gato">
        </div>
    </div>


    <footer>
        <p>&copy; 2023 Adote um Amigo. Todos os direitos reservados.</p>
        <p><a href="#">Política de Privacidade</a> | <a href="#">Termos de Uso</a></p>
    </footer>

    




    <!-- botoes de evento on click -->
     
    

    <script>
      document.getElementById("meuBotao").addEventListener("click", function() {
        window.location.href = "Login.html";
      });
    </script>




<script>
  document.getElementById("meuBotao").addEventListener("click", function() {
    window.location.href = "Cadastro.html";
  });
</script>


<script>
   document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;

    try {
        // Enviar a solicitação de login para o back-end
        const resLogin = await fetch('http://localhost:3000/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, senha })
        });

        const data = await resLogin.json();

        if (!resLogin.ok) {
            throw new Error(data.message || 'Erro ao realizar login');
        }

        // Salvar o nome do usuário e a mensagem de sucesso
        const nomeUsuario = data.nome_usuario;
        console.log('Login efetuado com sucesso! Nome do usuário:', nomeUsuario);

        // Salvar o nome do usuário no sessionStorage para acessá-lo em outras páginas
        sessionStorage.setItem('nome_usuario', nomeUsuario);

        // Redirecionar após 2 segundos
        setTimeout(() => {
            window.location.href = data.redirect;
        }, 2000);

    } catch (error) {
        console.error(error);
        alert(error.message);
    }
});

</script>

</body>
</html>
